services:
  # -------------------------
  # 1. API Service (NestJS)
  # -------------------------
  - type: web
    name: yt-trend-api
    runtime: node
    plan: free
    # ชี้ไปยัง Root ของ Monorepo เพราะเราใช้ pnpm workspace
    rootDir: .
    # คำสั่ง Build: ใช้ npx เรียก pnpm แบบไม่ต้องติดตั้งแบบ Global
    buildCommand: npx pnpm install && npx pnpm build:api
    # คำสั่ง Start: รัน production build ของ api
    startCommand: node apps/api/dist/main
    envVars:
      - key: PORT
        value: 10000
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

